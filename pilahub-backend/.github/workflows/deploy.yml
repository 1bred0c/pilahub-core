name: Deploy Backend to GCP

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Đã nâng cấp lên v4 cho hết càm ràm
        
      - name: Inject Firebase config file
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_KEY_JSON }}
        run: |
          # Tạo sẵn thư mục resources phòng trường hợp Git nó không lưu thư mục rỗng
          mkdir -p pilahub/src/main/resources
          
          # Bơm nội dung vào đúng thư mục con pilahub
          echo "$FIREBASE_SECRET" > pilahub/src/main/resources/firebase-key.json  
          
      - name: Setup Java 17
        uses: actions/setup-java@v4 # Đã nâng cấp lên v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR file
        # Chỉ đường cho Maven chui vào đúng thư mục rồi mới chạy lệnh
        run: |
          cd pilahub
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          # Chỉ đường cho Docker vào đúng thư mục để tìm Dockerfile
          context: ./pilahub
          push: true
          tags: congtuong1702/pilahub-be:latest

      - name: Deploy to Google Cloud VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd pilahub-deploy
            sudo docker compose pull backend
            sudo docker compose up -d backend
