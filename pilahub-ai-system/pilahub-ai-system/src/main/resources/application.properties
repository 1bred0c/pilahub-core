spring.application.name=pilahub-ai-system
server.port=8000

# Gemini API Configuration
# The Gemini Client expects GOOGLE_API_KEY environment variable
gemini.api.key=${GOOGLE_API_KEY:}
gemini.api.model=gemini-3-flash-preview
gemini.api.temperature=0.7
gemini.api.max-tokens=4096
gemini.api.timeout-seconds=60

# Gemini File API Configuration
gemini.api.file-upload-url=https://generativelanguage.googleapis.com/upload/v1beta/files
gemini.api.file-list-url=https://generativelanguage.googleapis.com/v1beta/files

# Local File Storage Configuration
file.storage.local-path=uploads/gemini-backups
file.storage.scoring-guideline-filename=quy-dinh-cham-diem-suc-khoe.md

# Multipart file upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

